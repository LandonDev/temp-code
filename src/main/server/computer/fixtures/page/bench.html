<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TempCode bench</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 24px; max-width: 720px; }
  fieldset { margin: 0 0 16px; }
  label { display: block; margin: 4px 0; }
  #orders li { padding: 4px 0; }
  #orders button { margin-left: 8px; }
</style>
</head>
<body>
<h1>Bench</h1>
<p>Scratch page for the computer words comparison. Nothing on it is real, and nothing leaves this page.</p>
<p id="status" role="status"></p>

<form id="order">
  <fieldset>
    <legend>Order form</legend>
    <label>Name <input id="name" name="name"></label>
    <label>Email <input id="email" name="email" type="email"></label>
    <label>Size
      <select id="size" name="size">
        <option value="S">Small</option>
        <option value="M" selected>Medium</option>
        <option value="L">Large</option>
      </select>
    </label>
    <label><input id="gift" name="gift" type="checkbox"> Gift wrap</label>
    <div role="radiogroup" aria-label="Delivery">
      <label><input type="radio" name="delivery" value="standard" checked> Standard</label>
      <label><input type="radio" name="delivery" value="express"> Express</label>
    </div>
  </fieldset>
  <button id="submit" type="submit">Submit</button>
</form>

<h2>Past orders</h2>
<p id="count"></p>
<ol id="orders" aria-label="Past orders"></ol>

<script>
// mulberry32 and seededOrders: the same code scripts/lib/computerTasks.ts runs.
// One function scope: a top-level `var status` or `var name` would be window's own.
;(function () {
function mulberry32(a) {
  return function () {
    a |= 0
    a = (a + 0x6d2b79f5) | 0
    var t = Math.imul(a ^ (a >>> 15), 1 | a)
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
  }
}
function seededOrders(seed) {
  var r = mulberry32(seed)
  var alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'
  var out = []
  var seen = {}
  while (out.length < 60) {
    var id = ''
    for (var i = 0; i < 4; i++) id += alphabet[Math.floor(r() * alphabet.length)]
    var price = ((100 + Math.floor(r() * 9900)) / 100).toFixed(2)
    if (seen[id]) continue
    seen[id] = true
    out.push({ id: id, price: price })
  }
  return out
}

var params = new URLSearchParams(location.hash.slice(1))
var seed = Number(params.get('seed') || 1)
var name = params.get('name') || ''
document.title = 'TempCode bench' + (name ? ' ' + name : '')

var status = document.getElementById('status')
var list = document.getElementById('orders')
var count = document.getElementById('count')
function recount() {
  count.textContent = list.children.length + ' orders'
}
seededOrders(seed).forEach(function (o) {
  var li = document.createElement('li')
  li.appendChild(document.createTextNode('Order ' + o.id + ' · ' + o.price))
  var del = document.createElement('button')
  del.type = 'button'
  del.textContent = 'Delete'
  del.setAttribute('aria-label', 'Delete order ' + o.id)
  del.addEventListener('click', function () {
    li.remove()
    status.textContent = 'Deleted ' + o.id
    recount()
  })
  li.appendChild(del)
  list.appendChild(li)
})
recount()

document.getElementById('order').addEventListener('submit', function (event) {
  event.preventDefault()
  var field = function (id) {
    return document.getElementById(id)
  }
  var delivery = event.target.querySelector('input[name="delivery"]:checked')
  status.textContent =
    'Submitted: ' +
    [field('name').value, field('email').value, field('size').value, field('gift').checked ? 'gift' : 'no gift', delivery ? delivery.value : ''].join(', ')
})
})()
</script>
</body>
</html>
