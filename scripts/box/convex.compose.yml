# Based on convex/convex-backend self-hosted/docker/docker-compose.yml.
name: convex-template
services:
  backend:
    image: ghcr.io/convex/convex-backend:latest@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    container_name: convex-template-backend
    cgroup_parent: prod.slice
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports: ["127.0.0.1:3210:3210", "127.0.0.1:3211:3211"]
    volumes: ["/srv/prod/data/convex-template:/convex/data"]
    environment:
      INSTANCE_NAME: convex-template
      INSTANCE_SECRET: ${INSTANCE_SECRET:?}
      POSTGRES_URL: ${POSTGRES_URL:?}
      DO_NOT_REQUIRE_SSL: "1"
      CONVEX_CLOUD_ORIGIN: https://convex-template.landonhale.com
      # HTTP actions get a separate hostname when a real app needs them.
      CONVEX_SITE_ORIGIN: http://127.0.0.1:3211
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      DOCUMENT_RETENTION_DELAY: "172800"
      RUST_LOG: info
    networks: [prod-data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3210/version]
      interval: 5s
      start_period: 15s
      timeout: 3s
      retries: 30
  dashboard:
    image: ghcr.io/convex/convex-dashboard:latest@sha256:f85cf0d0448b9c835ae3df5c7c1c6f0145dd4c8f0f92eb0245daf304efdd9f1a
    container_name: convex-template-dashboard
    cgroup_parent: prod.slice
    restart: unless-stopped
    ports: ["127.0.0.1:6791:6791"]
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: https://convex-template.landonhale.com
    depends_on:
      backend:
        condition: service_healthy
    networks: [prod-data]
networks:
  prod-data:
    external: true
