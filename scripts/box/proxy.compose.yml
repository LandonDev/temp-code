# Coolify-compatible proxy, constrained to a tunnel origin. No ACME/public TLS.
name: coolify-proxy
services:
  traefik:
    image: traefik:v3.7@sha256:0f6150202bc1fed72a7bd2107460eaa510e5b8a905f3fdb5b84f2c8619c33368
    container_name: coolify-proxy
    cgroup_parent: prod.slice
    restart: unless-stopped
    ports: ["127.0.0.1:80:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/coolify/proxy:/traefik
    networks: [coolify]
    command:
      - --ping=true
      - --ping.entrypoint=http
      - --entrypoints.http.address=:80
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=coolify
      - --providers.file.directory=/traefik/dynamic/
      - --providers.file.watch=true
    labels:
      - coolify.managed=true
      - coolify.proxy=true
      - traefik.enable=false
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:80/ping]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  coolify:
    external: true
