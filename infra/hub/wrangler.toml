name = "temp-code-hub"
main = "src/index.ts"
compatibility_date = "2025-10-08"

[[kv_namespaces]]
binding = "HUB_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "HOSTS"
class_name = "HostState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HostState"]

[triggers]
crons = ["* * * * *"]
